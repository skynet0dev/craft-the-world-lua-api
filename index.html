<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Craft the World — Lua API</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Lua modding API for Craft the World (2014), recovered from the game binary.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #4a7c59;
      --theme-color-dark: #37603f;
    }
    .sidebar-nav > ul > li > a { font-weight: 600; }

    /* Language switcher (fixed, top-right) */
    .lang-switch {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 30;
      display: flex;
      gap: 2px;
      padding: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      background: linear-gradient(to left, rgba(255,255,255,0.9), rgba(255,255,255,0));
    }
    .lang-switch a {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--theme-color-dark);
      border: 1px solid var(--theme-color);
      background: #fff;
      transition: all .15s ease;
    }
    .lang-switch a:hover { background: #f0f6f1; }
    .lang-switch a.active {
      background: var(--theme-color);
      color: #fff;
    }
    @media (max-width: 768px) {
      .lang-switch { padding: 8px 10px; font-size: 12px; }
    }

    /* Callout blocks */
    .callout {
      border-left: 4px solid var(--theme-color);
      background: #f4f8f5;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
    }
    .callout.warn { border-left-color: #d98324; background: #fdf6ee; }
    .callout.info { border-left-color: #3a7ca5; background: #eef5f9; }

    /* Method anchor spacing */
    h4 > code { font-size: 0.95em; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>

  <nav class="lang-switch" id="langSwitch" aria-label="Language">
    <a href="#/en/" data-lang="en">EN</a>
    <a href="#/ru/" data-lang="ru">RU</a>
  </nav>

  <noscript>
    This documentation requires JavaScript. Please enable it to view the Lua API reference.
  </noscript>

  <script>
    window.$docsify = {
      name: 'Craft the World · Lua API',
      repo: '',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      maxLevel: 4,
      alias: {
        '/en/$': '/en/README.md',
        '/ru/$': '/ru/README.md',
        '/$': '/README.md'
      },
      search: {
        depth: 3,
        placeholder: {
          '/en/': 'Search…',
          '/ru/': 'Поиск…',
          '/': 'Search / Поиск'
        },
        noData: {
          '/en/': 'No results',
          '/ru/': 'Ничего не найдено'
        }
      },
      pagination: {
        previousText: '←',
        nextText: '→',
        crossChapter: false,
        crossChapterText: '…'
      }
    };

    /* Highlight active language button based on the current hash route */
    (function () {
      function updateLangSwitch() {
        var hash = window.location.hash || '#/';
        var links = document.querySelectorAll('#langSwitch a');
        links.forEach(function (a) {
          a.classList.remove('active');
        });
        var active = null;
        if (hash.indexOf('#/ru') === 0) active = 'ru';
        else if (hash.indexOf('#/en') === 0) active = 'en';
        links.forEach(function (a) {
          if (a.getAttribute('data-lang') === active) a.classList.add('active');
        });
      }
      window.addEventListener('hashchange', updateLangSwitch);
      window.addEventListener('DOMContentLoaded', updateLangSwitch);
      setTimeout(updateLangSwitch, 100);
    })();
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Pagination plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Copy-code plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Prism: Lua language (Docsify bundles Prism core + a few langs, Lua is not included) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-lua.min.js"></script>
</body>
</html>
